---
- name: Ensure basic packages are installed
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - rsync
    state: present
    update_cache: yes

- name: Allow external ssh on port 2999 and https
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "2999"
    - "80"
    - "443"

- name: Enable UFW with default deny policy
  ufw:
    state: enabled
    policy: deny