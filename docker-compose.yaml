services:
  controller:
    build:
      context: controller
      dockerfile: Dockerfile
    container_name: controller
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock # host docker API access
      - rproxy_config:/app/rproxy # shared rproxy configs
      - ./web-server:/app/web-server:ro # web-server for creating new instances
      - controller_data:/app/data # persistent data storage
  rproxy:
    build:
      context: rproxy
      dockerfile: Dockerfile
    container_name: rproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - rproxy_config:/etc/nginx/conf.d # shared rproxy configs

volumes:
  rproxy_config:
  controller_data: